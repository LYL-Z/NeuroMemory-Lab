[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromemory-cortex"
version = "0.2.0"
description = "Local-first evidence memory and synthetic neuroscience lab"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["neuromemory_cortex*"]

[tool.setuptools.package-data]
neuromemory_cortex = ["ui/*.html", "ui/*.css", "ui/*.js"]
